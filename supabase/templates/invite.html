<div style="font-family: Arial, sans-serif; max-width: 520px; margin: 0 auto; padding: 24px; border: 1px solid #D4AF37;">

  <p>Здравствуйте!</p>
  <p>Вас пригласили в CRM NurLife. Чтобы войти, перейдите по ссылке и задайте пароль:</p>
